<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Equipos</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 30px 15px; 
    }
    
    body::before {
      content: "PROPIEDAD DE JOSE MANUEL JARA - EQUIPOS";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 30px;
      font-weight: bold;
      color: rgba(0, 0, 0, 0.025);
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
    }

    .container { 
      max-width: 480px; 
      margin: 0 auto; 
      background: white; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      position: relative; 
    }

    h2 { 
      text-align: center; 
      color: #1a252f; 
      margin-top: 5px;
      margin-bottom: 20px; 
      font-size: 22px;
    }

    /* PESTAÑAS (TABS) CON RENDERIZADO VISUAL COMPLETO */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background-color: #f8f9fa;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .tab {
      flex: 1;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #4a5568;
      background-color: #e2e8f0;
      border-radius: 7px;
      transition: all 0.2s ease;
      user-select: none;
      font-size: 15px;
      border: none;
      outline: none;
    }
    .tab.active-retiro {
      background-color: #2980b9 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 8px rgba(41, 128, 185, 0.3);
    }
    .tab.active-entrega {
      background-color: #27ae60 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 8px rgba(39, 174, 96, 0.3);
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .input-group { margin-bottom: 18px; }
    label { 
      display: block; 
      font-weight: bold; 
      margin-bottom: 6px; 
      color: #34495e; 
      font-size: 14px;
    }
    
    input { 
      width: 100%; 
      padding: 12px; 
      font-size: 16px !important; 
      border: 2px solid #bdc3c7; 
      border-radius: 6px; 
      box-sizing: border-box; 
      outline: none; 
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input:focus { 
      border-color: #3498db; 
      background-color: #eaf2f8; 
    }
    input:disabled {
      background-color: #f2f4f4;
      cursor: not-allowed;
    }
    
    .btn-guardar {
      color: white;
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-guardar.retiro { background-color: #2980b9; }
    .btn-guardar.retiro:hover { background-color: #1f618d; }
    .btn-guardar.entrega { background-color: #27ae60; }
    .btn-guardar.entrega:hover { background-color: #1e8449; }
    
    .btn-guardar:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .status { 
      padding: 12px; 
      font-weight: bold; 
      text-align: center; 
      border-radius: 6px; 
      margin-bottom: 18px; 
      background-color: #ebf5fb; 
      color: #2980b9; 
      border: 1px solid #aed6f1; 
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }
    .status-step2 {
      background-color: #fef9e7;
      color: #7d6608;
      border-color: #f9e79f;
    }
    .success { 
      background-color: #d4edda; 
      color: #155724; 
      border-color: #c3e6cb; 
    }
    .danger { 
      background-color: #f8d7da; 
      color: #721c24; 
      border-color: #f5c6cb; 
    }

    .watermark {
      text-align: center;
      font-size: 11px;
      color: #a0aec0;
      margin-top: 25px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Control de Equipos</h2>

    <!-- PESTAÑAS PRINCIPALES -->
    <div class="tabs">
      <button type="button" id="tabRetiro" class="tab active-retiro" onclick="cambiarTab('retiro')">📥 Retiro Equipo</button>
      <button type="button" id="tabEntrega" class="tab" onclick="cambiarTab('entrega')">📤 Entrega Equipo</button>
    </div>

    <!-- SECCIÓN RETIRO -->
    <div id="seccionRetiro" class="form-section active">
      <div id="statusRetiro" class="status" onclick="resetFormulario('retiro')" title="Haz clic para reiniciar">
        Paso 1: Anotación de número de EQUIPO
      </div>

      <div class="input-group">
        <label for="inputEquipoRetiro">N° de Equipo:</label>
        <input type="text" inputmode="numeric" id="inputEquipoRetiro" placeholder="Anotar número de equipo..." autocomplete="off">
      </div>

      <div class="input-group">
        <label for="inputRutRetiro">RUT de la Persona:</label>
        <input type="text" inputmode="numeric" id="inputRutRetiro" placeholder="Esperando equipo..." disabled autocomplete="off">
      </div>

      <button type="button" id="btnGuardarRetiro" class="btn-guardar retiro" onclick="confirmarYGuardar('retiro')" disabled>💾 Guardar Retiro</button>
    </div>

    <!-- SECCIÓN ENTREGA -->
    <div id="seccionEntrega" class="form-section">
      <div id="statusEntrega" class="status status-step2" onclick="resetFormulario('entrega')" title="Haz clic para reiniciar">
        Paso 1: Anotar número de EQUIPO a devolver
      </div>

      <div class="input-group">
        <label for="inputEquipoEntrega">N° de Equipo a Devolver:</label>
        <input type="text" inputmode="numeric" id="inputEquipoEntrega" placeholder="Anotar número de equipo..." autocomplete="off">
      </div>

      <button type="button" id="btnGuardarEntrega" class="btn-guardar entrega" onclick="confirmarYGuardar('entrega')" disabled>💾 Guardar Entrega</button>
    </div>

    <div class="watermark">
      PROPIEDAD DE JOSE MANUEL JARA - EQUIPOS
    </div>
  </div>

  <script>
    // URL DE TU WEB APP DE GOOGLE APPS SCRIPT
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbweYvrfdTCcULjSd4sAkEZ2--wMiDiKedQV1BU76LJDEtbBwzLLBGkolHbxEzm4CIDnmA/exec"; 

    let modoActual = "retiro";
    let timerReset = null;

    function cambiarTab(modo) {
      if (timerReset) clearTimeout(timerReset);
      modoActual = modo;
      const tabRetiro = document.getElementById("tabRetiro");
      const tabEntrega = document.getElementById("tabEntrega");
      const seccionRetiro = document.getElementById("seccionRetiro");
      const seccionEntrega = document.getElementById("seccionEntrega");

      if (modo === "retiro") {
        tabRetiro.className = "tab active-retiro";
        tabEntrega.className = "tab";
        seccionRetiro.classList.add("active");
        seccionEntrega.classList.remove("active");
        resetFormulario("retiro");
      } else {
        tabEntrega.className = "tab active-entrega";
        tabRetiro.className = "tab";
        seccionEntrega.classList.add("active");
        seccionRetiro.classList.remove("active");
        resetFormulario("entrega");
      }
    }

    function resetFormulario(modo) {
      if (timerReset) clearTimeout(timerReset);

      if (modo === "retiro") {
        const inputEq = document.getElementById("inputEquipoRetiro");
        const inputRt = document.getElementById("inputRutRetiro");
        const btnG = document.getElementById("btnGuardarRetiro");
        const statusR = document.getElementById("statusRetiro");

        inputEq.value = "";
        inputRt.value = "";
        inputEq.disabled = false;
        inputRt.disabled = true;
        btnG.disabled = true;
        btnG.innerText = "💾 Guardar Retiro";
        statusR.innerText = "Paso 1: Anotación de número de EQUIPO";
        statusR.className = "status";
        setTimeout(() => inputEq.focus(), 50);
      } else {
        const inputEqE = document.getElementById("inputEquipoEntrega");
        const btnGE = document.getElementById("btnGuardarEntrega");
        const statusE = document.getElementById("statusEntrega");

        inputEqE.value = "";
        inputEqE.disabled = false;
        btnGE.disabled = true;
        btnGE.innerText = "💾 Guardar Entrega";
        statusE.innerText = "Paso 1: Anotar número de EQUIPO a devolver";
        statusE.className = "status status-step2";
        setTimeout(() => inputEqE.focus(), 50);
      }
    }

    // 1. FORMATEO DINÁMICO DE RUT CHILENO (Puntos y Guion)
    function formatearRutChileno(valor) {
      let limpio = valor.toUpperCase().replace(/[^0-9K]/g, "");
      if (limpio === "") return "";
      
      let cuerpo = "";
      let dv = "";
      
      if (limpio.endsWith("11") && limpio.length > 3) {
        cuerpo = limpio.slice(0, -2);
        dv = "11";
      } else {
        cuerpo = limpio.slice(0, -1);
        dv = limpio.slice(-1);
      }
      
      if (limpio.length === 1 || (limpio.length === 2 && dv === "11")) {
        return limpio;
      }
      
      let cuerpoFormateado = "";
      while (cuerpo.length > 3) {
        cuerpoFormateado = "." + cuerpo.slice(-3) + cuerpoFormateado;
        cuerpo = cuerpo.slice(0, -3);
      }
      cuerpoFormateado = cuerpo + cuerpoFormateado;
      
      return cuerpoFormateado + "-" + dv;
    }

    // 2. NORMALIZACIÓN DE TEXTO Y REEMPLAZO DE -11 POR -K
    function limpiarYNormalizarTexto(str) {
      if (!str) return "";
      let texto = str.trim().toUpperCase();
      if (texto.endsWith("-11")) {
        texto = texto.slice(0, -3) + "-K";
      }
      return texto;
    }

    // --- ELEMENTOS RETIRO ---
    const inputEquipoRetiro = document.getElementById("inputEquipoRetiro");
    const inputRutRetiro = document.getElementById("inputRutRetiro");
    const btnGuardarRetiro = document.getElementById("btnGuardarRetiro");
    const statusRetiro = document.getElementById("statusRetiro");

    function procesarEquipoRetiro() {
      const val = limpiarYNormalizarTexto(inputEquipoRetiro.value);
      if (val !== "") {
        inputEquipoRetiro.value = val;
        if (!inputEquipoRetiro.disabled) {
          inputEquipoRetiro.disabled = true;
          inputRutRetiro.disabled = false;
          inputRutRetiro.placeholder = "Ej: 12.345.678-9 o -11 para K";
          statusRetiro.innerText = "Paso 2: Anotar RUT de la persona (si es K usar -11)";
          statusRetiro.className = "status status-step2";
          inputRutRetiro.focus();
        }
      }
    }

    inputEquipoRetiro.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        procesarEquipoRetiro();
      }
    });

    inputEquipoRetiro.addEventListener("blur", function() {
      if (!inputEquipoRetiro.disabled && inputEquipoRetiro.value.trim() !== "") {
        procesarEquipoRetiro();
      }
    });

    // Evento INPUT para formatear RUT en tiempo real y activar el botón
    inputRutRetiro.addEventListener("input", function() {
      inputRutRetiro.value = formatearRutChileno(inputRutRetiro.value);
      btnGuardarRetiro.disabled = (inputRutRetiro.value.trim() === "");
    });

    inputRutRetiro.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (inputRutRetiro.value.trim() !== "") {
          confirmarYGuardar("retiro");
        }
      }
    });

    // --- ELEMENTOS ENTREGA ---
    const inputEquipoEntrega = document.getElementById("inputEquipoEntrega");
    const btnGuardarEntrega = document.getElementById("btnGuardarEntrega");
    const statusEntrega = document.getElementById("statusEntrega");

    inputEquipoEntrega.addEventListener("input", function() {
      const val = inputEquipoEntrega.value.trim();
      btnGuardarEntrega.disabled = (val === "");
      if (val !== "") {
        statusEntrega.innerText = "Equipo listo. Presiona Guardar o Enter";
        statusEntrega.className = "status status-step2";
      }
    });

    inputEquipoEntrega.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (inputEquipoEntrega.value.trim() !== "") {
          confirmarYGuardar("entrega");
        }
      }
    });

    // 3. ENVÍO Y MANEJO DE RESPUESTAS CON NOMBRE Y EQUIPO
    function confirmarYGuardar(modo) {
      if (modo === "retiro") {
        const equipo = limpiarYNormalizarTexto(inputEquipoRetiro.value);
        const rut = limpiarYNormalizarTexto(inputRutRetiro.value);
        if (!equipo || !rut) return;

        inputEquipoRetiro.disabled = true;
        inputRutRetiro.disabled = true;
        btnGuardarRetiro.disabled = true;
        btnGuardarRetiro.innerText = "⏳ Guardando...";
        statusRetiro.innerText = "Procesando retiro en el servidor...";
        statusRetiro.className = "status";

        enviarPeticion("retiro", equipo, rut);
      } else {
        const equipo = limpiarYNormalizarTexto(inputEquipoEntrega.value);
        if (!equipo) return;

        inputEquipoEntrega.disabled = true;
        btnGuardarEntrega.disabled = true;
        btnGuardarEntrega.innerText = "⏳ Guardando...";
        statusEntrega.innerText = "Procesando entrega en el servidor...";
        statusEntrega.className = "status";

        enviarPeticion("entrega", equipo, "");
      }
    }

    function enviarPeticion(accion, equipo, rut) {
      // Formato explícito de fecha con barras (dd/MM/yyyy HH:mm:ss)
      const ahora = new Date();
      const opciones = { timeZone: "America/Santiago", hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      const partesFecha = new Intl.DateTimeFormat('es-CL', opciones).formatToParts(ahora);

      let d = partesFecha.find(p => p.type === 'day').value;
      let m = partesFecha.find(p => p.type === 'month').value;
      let y = partesFecha.find(p => p.type === 'year').value;
      let h = partesFecha.find(p => p.type === 'hour').value;
      let min = partesFecha.find(p => p.type === 'minute').value;
      let s = partesFecha.find(p => p.type === 'second').value;

      const fechaConBarras = `${d}/${m}/${y} ${h}:${min}:${s}`;

      const payload = {
        accion: accion,
        equipo: equipo,
        rut: rut,
        fecha: fechaConBarras
      };

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la red");
        return response.json();
      })
      .then(res => {
        const targetStatus = (accion === "retiro") ? statusRetiro : statusEntrega;
        if (res.status === "OK") {
          targetStatus.innerText = res.mensaje || "¡Registro exitoso!";
          targetStatus.className = "status success";
        } else {
          targetStatus.innerText = res.mensaje || "Atención: No se pudo registrar";
          targetStatus.className = "status danger";
        }
        timerReset = setTimeout(() => resetFormulario(accion), 2500);
      })
      .catch(err => {
        const targetStatus = (accion === "retiro") ? statusRetiro : statusEntrega;
        targetStatus.innerText = "Error de conexión con el servidor.";
        targetStatus.className = "status danger";
        console.error(err);
        timerReset = setTimeout(() => resetFormulario(accion), 3000);
      });
    }

    // Prevención de zoom automático al enfocar inputs en teléfonos móviles
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', function() {
        setTimeout(() => {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        }, 50);
      }, { passive: true });
    });
  </script>
</body>
</html>
